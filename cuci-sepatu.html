<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Cuci Sepatu Mahasiswa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
            color: #252b3a;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .deskripsi {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* Form dan tabel disusun kiri-kanan */
        .wadah {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .form-box,
        .tabel-box {
            flex: 1;
            min-width: 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #526f8c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #3e5873;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background-color: #f0f2f6;
        }

        .petunjuk {
            font-size: 12px;
            color: #27804a;
            margin-top: 8px;
        }

        .hasil {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #eef8f0;
            border: 1px solid #b7dfc0;
            border-radius: 10px;
        }

        .hasil h2 {
            color: #27804a;
        }

        /* Tampilan untuk layar HP */
        @media (max-width: 650px) {
            .wadah {
                flex-direction: column;
            }

            .form-box,
            .tabel-box {
                width: 100%;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Layanan Cuci Sepatu Mahasiswa</h1>

        <p class="deskripsi">
            Pemesanan jasa shoe cleaning dengan layanan antar-jemput.
        </p>

        <div class="wadah">

            <!-- FORM PENJEMPUTAN -->
            <div class="form-box">

                <h2>Form Penjemputan</h2>

                <form id="formPenjemputan">

                    <label for="nama">Nama</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama"
                        required
                    >

                    <label for="layanan">Jenis Layanan</label>
                    <select id="layanan" required>
                        <option value="Deep Clean">Deep Clean</option>
                        <option value="Unyellowing">Unyellowing</option>
                        <option value="Fast Clean">Fast Clean</option>
                    </select>

                    <label for="jumlah">Jumlah Sepatu</label>
                    <input
                        type="number"
                        id="jumlah"
                        placeholder="Masukkan jumlah sepatu"
                        min="1"
                        required
                    >

                    <p class="petunjuk">Angka dan lebih dari 0.</p>

                    <button type="submit">Jemput Sepatu</button>

                </form>

            </div>

            <!-- TABEL JENIS LAYANAN -->
            <div class="tabel-box">

                <h2>Jenis Layanan</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Layanan</th>
                            <th>Harga / Pasang</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Deep Clean</td>
                            <td>Rp 50.000</td>
                        </tr>

                        <tr>
                            <td>Unyellowing</td>
                            <td>Rp 65.000</td>
                        </tr>

                        <tr>
                            <td>Fast Clean</td>
                            <td>Rp 35.000</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>

        <!-- HASIL PEMESANAN -->
        <div class="hasil" id="hasil">
            <h2>Pemesanan Berhasil!</h2>
            <p id="detailPesanan"></p>
            <p id="totalHarga"></p>
        </div>

    </div>

    <script>
        const form = document.getElementById("formPenjemputan");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Mengambil data dari form
            const nama = document.getElementById("nama").value.trim();
            const layanan = document.getElementById("layanan").value;
            const jumlah = document.getElementById("jumlah").value;

            const jumlahSepatu = Number(jumlah);

            // Validasi nama
            if (nama === "") {
                alert("Nama harus diisi!");
                return;
            }

            // Validasi jumlah sepatu
            if (jumlah.trim() === "" || isNaN(jumlahSepatu) || jumlahSepatu <= 0) {
                alert("Jumlah sepatu harus berupa angka lebih dari 0!");
                return;
            }

            // Menentukan harga berdasarkan layanan
            let harga = 0;

            if (layanan === "Deep Clean") {
                harga = 50000;
            } else if (layanan === "Unyellowing") {
                harga = 65000;
            } else if (layanan === "Fast Clean") {
                harga = 35000;
            }

            const total = harga * jumlahSepatu;

            // Dialog konfirmasi
            const konfirmasi = confirm(
                "Konfirmasi penjemputan sepatu?\n\n" +
                "Nama: " + nama + "\n" +
                "Layanan: " + layanan + "\n" +
                "Jumlah sepatu: " + jumlahSepatu + " pasang\n" +
                "Total harga: " + total.toLocaleString("id-ID", {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                })
            );

            // Jika pengguna memilih OK
            if (konfirmasi) {

                document.getElementById("hasil").style.display = "block";

                document.getElementById("detailPesanan").textContent =
                    "Nama: " + nama +
                    " | Layanan: " + layanan +
                    " | Jumlah: " + jumlahSepatu + " pasang";

                document.getElementById("totalHarga").textContent =
                    "Total harga: " +
                    total.toLocaleString("id-ID", {
                        style: "currency",
                        currency: "IDR",
                        maximumFractionDigits: 0
                    });

                alert("Pemesanan berhasil dikonfirmasi!");

                form.reset();

            } else {
                alert("Pemesanan dibatalkan.");
            }

        });
    </script>

</body>
</html>
