<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Cuci Sepatu Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Layanan Cuci Sepatu Mahasiswa</h1>

        <p class="deskripsi">
            Pemesanan jasa shoe cleaning dengan layanan antar-jemput.
        </p>

        <div class="wadah">

            <!-- FORM PENJEMPUTAN -->
            <div class="form-box">

                <h2>Form Penjemputan</h2>

                <form id="formPenjemputan">

                    <label for="nama">Nama</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama"
                        required
                    >

                    <label for="layanan">Jenis Layanan</label>
                    <select id="layanan" required>
                        <option value="Deep Clean">Deep Clean</option>
                        <option value="Unyellowing">Unyellowing</option>
                        <option value="Fast Clean">Fast Clean</option>
                    </select>

                    <label for="jumlah">Jumlah Sepatu</label>
                    <input
                        type="number"
                        id="jumlah"
                        placeholder="Masukkan jumlah sepatu"
                        min="1"
                        required
                    >

                    <p class="petunjuk">Angka dan lebih dari 0.</p>

                    <button type="submit">Jemput Sepatu</button>

                </form>

            </div>

            <!-- TABEL JENIS LAYANAN -->
            <div class="tabel-box">

                <h2>Jenis Layanan</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Layanan</th>
                            <th>Harga / Pasang</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Deep Clean</td>
                            <td>Rp 50.000</td>
                        </tr>

                        <tr>
                            <td>Unyellowing</td>
                            <td>Rp 65.000</td>
                        </tr>

                        <tr>
                            <td>Fast Clean</td>
                            <td>Rp 35.000</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>

        <!-- HASIL PEMESANAN -->
        <div class="hasil" id="hasil">
            <h2>Pemesanan Berhasil!</h2>
            <p id="detailPesanan"></p>
            <p id="totalHarga"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
